<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhaseEval review</title>
<!-- Workbench review page (W4 page, AXA-43zwk.8). Every value on it comes from /api/attempts; nothing is bundled. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/workbench/assets/workbench.css">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <span class="logo">PhaseEval</span>
    <span class="crumb" id="crumb"></span>
    <span class="qnav"><button type="button" class="qbtn" data-act="prev" aria-label="Previous snapshot">Prev <span class="kbd">k</span></button><button type="button" class="qbtn" data-act="next" aria-label="Next snapshot">Next <span class="kbd">j</span></button></span>
    <span class="timer" id="timer"></span>
  </header>
  <form class="auth hidden" id="auth" autocomplete="off">
    <label for="token-input" class="muted">Bearer token, kept in this tab's session storage only</label>
    <input id="token-input" type="password" placeholder="paste bearer token" autocomplete="off">
    <button type="submit" class="qbtn">Use token</button>
  </form>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <nav class="stages" id="stages" aria-label="Review stages"></nav>
  <div class="brief" id="brief"></div>
  <main id="main"></main>
</div>
<script src="/workbench/assets/workbench.js"></script>
</body>
</html>
