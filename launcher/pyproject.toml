[project]
name = "phaseeval-launcher"
version = "0.1.0"
description = "The locked environment PhaseEval's click-and-run launcher serves from (src/phaseeval/launcher.py)"
requires-python = "==3.12.*"
dependencies = [
    "fastapi",
    "uvicorn",
    "websockets",
    "python-multipart",
    "pydantic==2.12.5",  # the version the workbench tests and schemas/ were made with (F9)
    "numpy",
    "scipy",
    "pyyaml",
    "httpx",
    "requests",
    "asteval",
    "pymatgen",
    "dara-xrd==1.1.5",
]

[tool.uv]
package = false

# Dara's bundled hull tables are all the chemistry panel reads (axa.workbench.chemistry), so
# dara-xrd is installed without its refinement and search stack (ray, torch, mp-api).
[[tool.uv.dependency-metadata]]
name = "dara-xrd"
version = "1.1.5"
requires-dist = []
